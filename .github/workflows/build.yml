name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK (cmdline-tools, sem depender de action de terceiros)
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -sSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
          unzip -q cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build_output.log

      - name: Show real error if build failed
        if: steps.build.outcome == 'failure'
        run: |
          grep -E "^e: |error:|What went wrong" build_output.log > errors_only.log || true
          if [ -s errors_only.log ]; then
            MSG=$(cat errors_only.log | tail -c 3800 | perl -pe 's/\n/%0A/g; s/\r/%0D/g')
          else
            MSG=$(tail -c 3800 build_output.log | perl -pe 's/\n/%0A/g; s/\r/%0D/g')
          fi
          echo "::error::$MSG"
          exit 1

      - name: Definir sufixo com o hash do commit
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: CarteiraPX-debug-apk-${{ steps.sha.outputs.short }}
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload full build log always
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-full-log
          path: build_output.log
